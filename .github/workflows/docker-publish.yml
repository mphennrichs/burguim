name: Build and Push Docker Image

# Push na develop -> builda a imagem de produção (Frappe/ERPNext/HRMS + ury +
# os 4 frontends Vite), publica no GHCR com tag :sha-<commit> e avisa o
# fogolab pra deployar essa versão exata. Este repo é agnóstico ao deployer
# (não conhece o Komodo).

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'infra/**'

env:
  REGISTRY: ghcr.io
  OWNER: mphennrichs
  IMAGE: burguim
  # Pinned frappe_docker ref - only the entrypoint/start scripts and base
  # image tags come from here (see docker/production/Containerfile).
  FRAPPE_DOCKER_REF: v3.2.2

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [vars]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout burguim
        uses: actions/checkout@v4

      - name: Checkout frappe_docker (entrypoint/start scripts only)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Containerfile
          build-contexts: |
            frappe_docker=./frappe_docker
          secret-files: |
            apps_json=./docker/production/apps.json
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}:${{ needs.vars.outputs.sha }}
          cache-from: type=gha,scope=burguim
          cache-to: type=gha,mode=max,scope=burguim

  # Após a imagem publicada, avisa o fogolab com a TAG exata pra ele editar o
  # compose, commitar e disparar o redeploy via webhook do Komodo.
  notify-deploy:
    needs: [vars, build]
    runs-on: ubuntu-latest
    steps:
      - name: Notify fogolab to deploy this version
        env:
          DISPATCH_TOKEN: ${{ secrets.FOGOLAB_DISPATCH_TOKEN }}
          TAG: ${{ needs.vars.outputs.sha }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ env.OWNER }}/fogolab/dispatches \
            -d "{\"event_type\":\"image-updated\",\"client_payload\":{\"stack\":\"burguim\",\"tag\":\"${TAG}\"}}"
